<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Laura 💖</title>

<style>
body{
    margin:0;
    padding:0;
    background: url("foto.JPEG") no-repeat center center fixed;
    background-size: contain;
    background-color: black;
    font-family: Arial, sans-serif;
    text-align:center;
    color:white;
    overflow:hidden;
}

/* Oscurecer fondo */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:-1;
}

h1{margin-top:80px;font-size:2.8em;}
p{font-size:1.4em;}

.botones{
    margin-top:30px;
    position:relative;
    width:300px;
    height:150px;
    margin-left:auto;
    margin-right:auto;
}

button{
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    position:absolute;
    transition:0.3s;
}

#si{
    background:#00e676;
    left:30px;
    top:50px;
}

#no{
    background:#ff1744;
    right:30px;
    top:50px;
}

#mensajeFinal{
    margin-top:20px;
    font-size:1.6em;
    display:none;
}

#countdown{
    font-size:1.5em;
    margin-top:15px;
}

/* Corazones */
.heart{
    position:absolute;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp{
    0%{transform:translateY(0); opacity:1;}
    100%{transform:translateY(-800px); opacity:0;}
}
</style>
</head>

<body>

<h1>💖 Laura 💖</h1>
<p>David tiene una pregunta muy importante para ti...</p>
<p>¿Quieres ser mi 14 de Febrero este sabado a las 6:00 pm? 🌹✨</p>

<div id="countdown"></div>

<div class="botones">
<button id="si" onclick="aceptar()">Claro que sí 💕</button>
<button id="no" onmouseover="moverNo()">No 😢</button>
</div>
<div id="mensajeTroll" style="
    margin-top:20px;
    font-size:2em;
    font-weight:bold;
    min-height:50px;
"></div>


<div id="mensajeFinal">
🥰 Sabía que dirías que sí, Laura.  
Nos vemos a las 6:00 pm ❤️ — David
</div>

<!-- Audio oculto -->
<audio id="musica">
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>

let intentos = 0;
let ultimoMovimiento = 0;
let tiempoEspera = 800;

// aquí siguen tus otras funciones...

// Reproducir música cuando haga cualquier clic
document.body.addEventListener("click", function(){
    document.getElementById("musica").play();
}, {once:true});

// Cuenta regresiva 6 PM
function actualizarCuenta(){
    const ahora = new Date();
    const evento = new Date();
    evento.setHours(18,0,0,0);

    if(ahora > evento){
        evento.setDate(evento.getDate()+1);
    }

    const diff = evento - ahora;

    const horas = Math.floor(diff/(1000*60*60));
    const minutos = Math.floor((diff%(1000*60*60))/(1000*60));
    const segundos = Math.floor((diff%(1000*60))/1000);

    document.getElementById("countdown").innerHTML =
    "⏳ Faltan: " + horas + "h " + minutos + "m " + segundos + "s 💘";
}
setInterval(actualizarCuenta,1000);

// Botón imposible
    
    function moverNo(){
    let ahora = Date.now();

    // Evita que cuente demasiado rápido
    if(ahora - ultimoMovimiento < tiempoEspera){
        return;
    }

    ultimoMovimiento = ahora;

    let boton = document.getElementById("no");
    let mensaje = document.getElementById("mensajeTroll");

    intentos++;

    boton.style.position = "fixed";

    let anchoPantalla = window.innerWidth - boton.offsetWidth;
    let altoPantalla = window.innerHeight - boton.offsetHeight;

    let x = Math.random() * anchoPantalla;
    let y = Math.random() * altoPantalla;

    boton.style.left = x + "px";
    boton.style.top = y + "px";

    if(intentos == 5){
        mensaje.innerText = "¿Segura? 😳";
    }

    if(intentos == 10){
        mensaje.innerText = "Ya mejor di que sí ❤️";
    }

    if(intentos == 15){
        mensaje.innerText = "El destino ya decidió 😈";
    }

    if(intentos >= 20){
        mensaje.innerText = "Demasiado tarde... solo queda el SÍ 💖";
        boton.style.display = "none";
    }
}


    document.addEventListener("mousemove", function(e){
    let boton = document.getElementById("no");
    let rect = boton.getBoundingClientRect();

    let distanciaX = e.clientX - (rect.left + rect.width/2);
    let distanciaY = e.clientY - (rect.top + rect.height/2);
    let distancia = Math.sqrt(distanciaX*distanciaX + distanciaY*distanciaY);

    if(distancia < 120){
        moverNo();
    }
});


// Aceptar
function aceptar(){
    document.getElementById("mensajeFinal").style.display="block";
}

// Corazones flotando
setInterval(()=>{
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.bottom="0px";
    heart.style.fontSize=(Math.random()*25+15)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
},500);

</script>


</body>
</html>
